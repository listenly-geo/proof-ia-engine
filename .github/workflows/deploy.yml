name: Déploiement MOTEUR PROOF IA (Apps Script)

on:
  push:
    paths:
      - 'automation/apps-script/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'dry / pull / deploy (push + nouvelle version) / publish (+ branche le web app EXISTANT) / bridge (+ crée ou met à jour un déploiement web app SÉPARÉ pour le pont watchdog) / test (exécute une fonction précise via l''API Apps Script, voir le champ function ci-dessous)'
        required: true
        default: 'dry'
      function:
        description: 'Uniquement pour action=test : nom exact de la fonction à exécuter (ex. processProspectionMachine, processOpportunitesMachine, processReplyAgentMachine)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/apps-script
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@3.0.4-alpha

      - name: Restore clasp credentials
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Determine action
        id: act
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
          else
            ACTION=$(tr -d '[:space:]' < ACTION.txt 2>/dev/null || echo "dry")
            echo "action=${ACTION:-dry}" >> "$GITHUB_OUTPUT"
          fi
          echo "Action retenue: ${ACTION:-dry}"

      - name: État actuel (toujours)
        run: |
          set -e
          echo "--- clasp status ---"
          clasp status 2>&1 | tee /tmp/status.txt
          echo "--- clasp deployments ---"
          clasp deployments 2>&1 | tee -a /tmp/status.txt
          echo "--- résumé (visible via l'API Checks, sans passer par les logs bruts) ---"
          while IFS= read -r line; do
            printf '::notice::%s\n' "$line"
          done < /tmp/status.txt

      - name: Rapatrier le vrai code/manifeste (sécurité avant 1er déploiement)
        if: steps.act.outputs.action == 'pull'
        run: |
          clasp pull
          echo "--- diff par rapport à ce qui était dans le dépôt ---"
          git -C "$GITHUB_WORKSPACE" diff --stat automation/apps-script || true

      - name: Committer le code réel rapatrié
        if: steps.act.outputs.action == 'pull'
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add automation/apps-script
          if git diff --cached --quiet; then
            echo "::notice::Rien de différent — le dépôt était déjà identique au script réel."
          else
            git commit -m "Sync: code/manifeste réels rapatriés depuis Apps Script (clasp pull)"
            git push origin HEAD:${{ github.ref_name }}
            echo "::notice::Code réel rapatrié et commité — relire automation/apps-script/appsscript.json avant tout deploy/publish."
          fi

      - name: Push du code
        if: steps.act.outputs.action == 'deploy' || steps.act.outputs.action == 'publish' || steps.act.outputs.action == 'bridge'
        run: |
          set +e
          clasp push --force 2>&1 | tee /tmp/push.txt
          CODE=${PIPESTATUS[0]}
          while IFS= read -r line; do
            printf '::notice::%s\n' "$line"
          done < /tmp/push.txt
          exit "$CODE"
        shell: bash

      - name: Nouvelle version
        if: steps.act.outputs.action == 'deploy' || steps.act.outputs.action == 'publish' || steps.act.outputs.action == 'bridge'
        id: version
        run: |
          set +e
          OUT=$(clasp version "Auto-déploiement GitHub Actions $(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>&1)
          CODE=$?
          echo "$OUT" | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done
          if [ $CODE -ne 0 ]; then
            exit $CODE
          fi
          VNUM=$(echo "$OUT" | grep -oE '[0-9]+' | tail -1)
          echo "version=$VNUM" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Brancher le web app sur cette version (même URL)
        if: steps.act.outputs.action == 'publish'
        run: |
          set +e
          DEPLOY_ID=$(cat deployment_id.txt 2>/dev/null || echo "")
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Aucun deployment_id.txt — faire un premier 'clasp deploy' manuel une fois, puis enregistrer l'ID retourné dans automation/apps-script/deployment_id.txt"
            exit 1
          fi
          OUT=$(clasp deploy --deploymentId "$DEPLOY_ID" --versionNumber "${{ steps.version.outputs.version }}" --description "Auto $(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>&1)
          CODE=$?
          echo "$OUT" | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done
          exit $CODE
        shell: bash

      - name: Pont web — créer ou mettre à jour le déploiement SÉPARÉ du watchdog
        if: steps.act.outputs.action == 'bridge'
        run: |
          set +e
          BRIDGE_ID=$(cat bridge_deployment_id.txt 2>/dev/null || echo "")
          if [ -z "$BRIDGE_ID" ]; then
            echo "::notice::Aucun bridge_deployment_id.txt — création d'un NOUVEAU déploiement web app dédié (le déploiement existant n'est pas touché)."
            OUT=$(clasp deploy --versionNumber "${{ steps.version.outputs.version }}" --description "Pont web watchdog" 2>&1)
          else
            echo "::notice::Mise à jour du déploiement pont web existant ($BRIDGE_ID), même URL."
            OUT=$(clasp deploy --deploymentId "$BRIDGE_ID" --versionNumber "${{ steps.version.outputs.version }}" --description "Pont web watchdog (maj)" 2>&1)
          fi
          CODE=$?
          echo "$OUT" | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done
          if [ $CODE -ne 0 ]; then
            exit $CODE
          fi
          if [ -z "$BRIDGE_ID" ]; then
            NEW_ID=$(echo "$OUT" | grep -oE '^- [A-Za-z0-9_-]+' | head -1 | sed 's/^- //')
            if [ -z "$NEW_ID" ]; then
              echo "::error::Déploiement créé mais impossible d'en extraire l'ID depuis la sortie clasp."
              exit 1
            fi
            echo "$NEW_ID" > bridge_deployment_id.txt
            echo "::notice::ID du déploiement pont web: $NEW_ID"
            echo "::notice::URL du pont web: https://script.google.com/macros/s/$NEW_ID/exec"
            cd "$GITHUB_WORKSPACE"
            git config user.email "actions@github.com"
            git config user.name "github-actions[bot]"
            git add automation/apps-script/bridge_deployment_id.txt
            git commit -m "Enregistrer l'ID du déploiement du pont web watchdog"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "::notice::URL du pont web (inchangée): https://script.google.com/macros/s/$BRIDGE_ID/exec"
          fi
        shell: bash

      - name: Test — exécuter une fonction précise (API Apps Script, authentifié)
        if: steps.act.outputs.action == 'test'
        run: |
          set +e
          FN="${{ github.event.inputs.function }}"
          if [ -z "$FN" ]; then
            echo "::error::action=test nécessite le champ 'function' (ex. processProspectionMachine)."
            exit 1
          fi
          echo "::notice::Exécution de $FN via l'API Apps Script (devMode, dernier code sauvegardé)..."
          OUT=$(node run-function.mjs "$FN" 2>&1)
          CODE=$?
          echo "$OUT" | while IFS= read -r line; do printf '::notice::%s\n' "$line"; done
          exit $CODE
        shell: bash
